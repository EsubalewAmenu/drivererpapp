name: drivererpapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.0.5
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  json_annotation: ^4.8.1
  google_sign_in: ^6.2.1
  googleapis: ^15.0.0
  googleapis_auth: ^1.4.1
  http: ^1.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.7
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  fl_chart: ^1.1.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.2.0
  in_app_purchase: ^3.2.0
  package_info_plus: ^8.0.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/erp_modules/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_launcher.png
  adaptive_icon_foreground: assets/logo_launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 24
  remove_alpha_ios: true

